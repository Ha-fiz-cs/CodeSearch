<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DF Fish Code Lookup</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0f0d;
    --surface: #111a15;
    --surface2: #1a2620;
    --border: #2a3d32;
    --accent: #00e676;
    --accent-dim: #00994f;
    --text: #e8f5e9;
    --text-muted: #6b8f74;
    --text-dim: #3d5c45;
    --code-bg: #003320;
    --code-text: #00e676;
    --red: #ff5252;
    --amber: #ffca28;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 0 20px 60px; }

  /* ── HEADER ── */
  header {
    padding: 48px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
  }
  .fish-icon {
    width: 42px; height: 42px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  h1 span { color: var(--accent); }
  .subtitle {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-left: 56px;
  }

  /* ── SEARCH ── */
  .search-wrap {
    position: relative;
    margin-bottom: 20px;
  }
  .search-wrap svg {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    padding: 14px 16px 14px 46px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #search::placeholder { color: var(--text-dim); }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,230,118,0.12);
  }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  .stats-bar span { color: var(--accent); font-weight: 700; }

  /* ── FILTER PILLS ── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .pill {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }
  .pill:hover { border-color: var(--accent-dim); color: var(--text); }
  .pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 700;
  }

  /* ── RESULTS TABLE ── */
  .table-wrap {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .t-head {
    display: grid;
    grid-template-columns: 80px 1fr 130px;
    background: var(--surface2);
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .t-head span {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .result-row {
    display: grid;
    grid-template-columns: 80px 1fr 130px;
    align-items: center;
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
    animation: fadeIn 0.15s ease;
  }
  .result-row:last-child { border-bottom: none; }
  .result-row:hover { background: var(--surface2); }
  .result-row:active { background: var(--surface); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .code-badge {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--code-text);
    background: var(--code-bg);
    padding: 3px 10px;
    border-radius: 6px;
    display: inline-block;
    letter-spacing: 1px;
    border: 1px solid var(--accent-dim);
    min-width: 44px;
    text-align: center;
  }
  .fish-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    padding: 0 12px;
  }
  .fish-name mark {
    background: rgba(0,230,118,0.2);
    color: var(--accent);
    border-radius: 3px;
    padding: 0 1px;
  }
  .cat-tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-align: right;
  }
  .cat-tag.piece { color: var(--amber); }
  .cat-tag.head  { color: var(--red); }
  .cat-tag.new   { color: var(--accent); }

  /* ── EMPTY ── */
  #empty {
    display: none;
    text-align: center;
    padding: 60px 20px;
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  #empty .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  #empty p { color: var(--text-muted); font-size: 14px; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #000;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 30px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 999;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── VACANT SECTION ── */
  .vacant-section {
    margin-top: 32px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .vacant-title {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .vacant-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
  }
  .vacant-item {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .vacant-code {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-dim);
    min-width: 22px;
  }
  .vacant-label {
    font-size: 11px;
    color: var(--text-dim);
  }

  /* ── FOOTER ── */
  footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.5px;
  }

  @media (max-width: 480px) {
    .t-head, .result-row { grid-template-columns: 64px 1fr 90px; }
    .fish-name { font-size: 13px; padding: 0 8px; }
    .cat-tag { font-size: 9px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo-row">
      <div class="fish-icon">🐟</div>
      <h1>DF Fish <span>Code Lookup</span></h1>
    </div>
    <p class="subtitle">// 182 varieties + 10 vacant slots — tap any row to copy code</p>
  </header>

  <div class="search-wrap">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search" type="search" placeholder="Search fish name or type a code number..." autocomplete="off" autofocus />
  </div>

  <div class="stats-bar">
    <div>Total: <span>182</span> fish</div>
    <div id="result-count">Showing: <span>182</span></div>
  </div>

  <div class="filters">
    <button class="pill active" data-cat="ALL">All</button>
    <button class="pill" data-cat="Full Fish">Full Fish</button>
    <button class="pill" data-cat="Fish Piece">Fish Piece</button>
    <button class="pill" data-cat="Fish Head">Fish Head</button>
  </div>

  <div class="table-wrap" id="table-wrap">
    <div class="t-head">
      <span>Code</span>
      <span>Fish Name</span>
      <span style="text-align:right">Category</span>
    </div>
    <div id="results"></div>
  </div>

  <div id="empty">
    <div class="empty-icon">🐡</div>
    <p>No fish found. Try a different name or code.</p>
  </div>

  <div class="vacant-section">
    <div class="vacant-title">// Vacant slots — for new varieties</div>
    <div class="vacant-grid" id="vacant-grid"></div>
  </div>

  <footer>DF FISH STALL ACCOUNTING SYSTEM &nbsp;·&nbsp; INTERNAL USE ONLY</footer>
</div>

<div id="toast"></div>

<script>
const FISH = [

  [4,"AYALA SMALL","Full Fish"],[5,"KOZHUVA BIG","Full Fish"],[6,"KOZHUVA SMALL","Full Fish"],
  [7,"CHEMMIN BIG","Full Fish"],[8,"CHEMMIN MEDIUM","Full Fish"],[9,"CHEMMIN SMALL","Full Fish"],
  [10,"PARAVA","Full Fish"],[11,"KANNI","Full Fish"],[12,"THOVARA VATTA","Full Fish"],
  [13,"CRAB","Full Fish"],[14,"MULLEN","Full Fish"],[15,"P MULLEN","Full Fish"],
  [16,"KANAMBU","Full Fish"],[17,"KILI BIG","Full Fish"],[18,"KILI MEDIUM","Full Fish"],
  [19,"KILI SMALL","Full Fish"],[20,"VELLOORI","Full Fish"],[21,"MANTHAL","Full Fish"],
  [22,"KAKKA","Full Fish"],[23,"SHEELAVU","Full Fish"],[24,"NANDAN","Full Fish"],
  [25,"ADU PARAVA","Full Fish"],[26,"KOONTHEL","Full Fish"],[27,"PLAMUTTAN","Full Fish"],
  [28,"KADAL BRAAL","Full Fish"],[29,"SILK","Full Fish"],[30,"KARIMEEN BIG","Full Fish"],
  [31,"KARIMEEN MEDIUM","Full Fish"],[32,"KARIMEEN SMALL","Full Fish"],
  [33,"CHOORA WHITE","Full Fish"],[34,"CHOORA BLACK","Full Fish"],
  [35,"PEPSI CHOORA","Full Fish"],[36,"PRANJIL","Full Fish"],[37,"THIRIYAN","Full Fish"],
  [38,"SUPPARA","Full Fish"],[39,"NATHOLY","Full Fish"],[40,"KADAL KALANJI","Full Fish"],
  [41,"KATTALA","Full Fish"],[42,"NEYMEEN SMALL","Full Fish"],[43,"EARI V I","Full Fish"],
  [44,"EARI V.","Full Fish"],[45,"VELA FULL","Full Fish"],[46,"NAADEN KALANJI","Full Fish"],
  [47,"THODY","Full Fish"],[48,"KERA FULL","Full Fish"],[49,"KERA PSC","Fish Piece"],
  [50,"OLA PSC","Fish Piece"],[51,"SRAVU PSC","Fish Piece"],[52,"NEYMEEN FULL","Full Fish"],
  [53,"NEYMEEN PSC","Fish Piece"],[54,"SHEELAVU PSC","Fish Piece"],[55,"VANGADA","Full Fish"],
  [56,"PUNNARAMEN FULL","Full Fish"],[57,"PUNNARAMEN PSC","Fish Piece"],
  [58,"TILOPIYA BIG","Full Fish"],[59,"TILOPIYA MEDIUM","Full Fish"],
  [60,"TILOPIYA SMALL","Full Fish"],[61,"PAMBADA","Full Fish"],[62,"VATTA FULL","Full Fish"],
  [63,"VATTA PSC","Fish Piece"],[64,"AVOLI BLACK","Full Fish"],[65,"AVOLI WHITE","Full Fish"],
  [66,"ROOH","Full Fish"],[67,"PIRANA","Full Fish"],[68,"KOORI VALA","Full Fish"],
  [69,"UNDANVILA FULL","Full Fish"],[70,"UNDAN VILA PSC","Fish Piece"],
  [71,"PARUNTHADA","Full Fish"],[72,"PARUNTHADA PSC","Fish Piece"],[73,"PARAVA","Full Fish"],
  [74,"FISH HEAD","Fish Head"],[75,"SILVER","Full Fish"],[76,"EATA SMALL","Full Fish"],
  [77,"EATA MEDIUM","Full Fish"],[78,"EATA BIG","Full Fish"],[79,"AARAL","Full Fish"],
  [80,"THATTAMA","Full Fish"],[81,"CHEPPERI FULL","Full Fish"],[82,"CHEPPERI PSC","Fish Piece"],
  [83,"POOMEAN SEA","Full Fish"],[84,"CHEBAALA","Full Fish"],[85,"NADAN POOMEAN","Full Fish"],
  [86,"PULLI MODHA","Full Fish"],[87,"CHEMBALLY SEA","Full Fish"],
  [88,"CHEMBALLY PSC","Fish Piece"],[89,"THIRUTHA","Full Fish"],[90,"KALAVA","Full Fish"],
  [91,"MORASH","Full Fish"],[92,"URTHAL","Full Fish"],[93,"UDUPURI","Full Fish"],
  [94,"KANNADY VATTA","Full Fish"],[95,"POLA VATTA","Full Fish"],[96,"PUZHA VATTA","Full Fish"],
  [97,"TIGER","Full Fish"],[98,"LOOMIYA VELA","Full Fish"],[99,"KOLAN","Full Fish"],
  [100,"NACHAKA","Full Fish"],[101,"MODHA FULL","Full Fish"],[102,"MODHA PSC","Fish Piece"],
  [103,"BUTTER FISH","Full Fish"],[104,"EARI YELLOW","Full Fish"],[105,"CUTTER","Full Fish"],
  [106,"NEYKERA","Full Fish"],[107,"KANNADI VATTA","Full Fish"],[108,"KATLAN","Full Fish"],
  [109,"AVOLY VATTA","Full Fish"],[110,"MANJA VATTA","Full Fish"],
  [111,"MANJA VATTA PSC","Fish Piece"],[112,"AYIRAMPALLI","Full Fish"],
  [113,"NEYCHOORA","Full Fish"],[114,"VARAYAN CHOORA","Full Fish"],
  [115,"WHITE VATTA","Full Fish"],[116,"THIRANDI","Full Fish"],[117,"AMUUR","Full Fish"],
  [118,"URATHAL","Full Fish"],[119,"NEYMUTTA","Full Fish"],[120,"PUNNARA VATTA","Full Fish"],
  [121,"NADAN VALA","Full Fish"],[122,"MANAG","Full Fish"],
  [123,"MANJA VATTA SMALL","Full Fish"],[124,"VELAMEEN","Full Fish"],
  [125,"VELAMEEN PSC","Fish Piece"],[126,"KALLAN VATTA FULL","Full Fish"],
  [127,"KALLAN VATTA PSC","Fish Piece"],[128,"PULLI EARI","Full Fish"],
  [129,"PULLI EARI PCS","Fish Piece"],[130,"CHUNDAN EARI","Full Fish"],
  [131,"CHUNDAN EARI PSC","Fish Piece"],[132,"KALLUME KAY","Full Fish"],
  [133,"THATHAMA PSC","Fish Piece"],[134,"GOLD FISH","Full Fish"],
  [135,"PULLI MODHA PSC","Fish Piece"],[136,"UNDA EARI","Full Fish"],
  [137,"UNDA EARI PSC","Fish Piece"],[138,"EATTA FULL","Full Fish"],
  [139,"EATTA PSC","Fish Piece"],[140,"CHOORA SMALL","Full Fish"],
  [141,"SRAVU FULL","Full Fish"],[142,"MANJA VILA","Full Fish"],
  [143,"KUNTHAL SMALL","Full Fish"],[144,"MULLEN BIG","Full Fish"],
  [145,"KARA CHEMMEEN","Full Fish"],[146,"PARAVA MULLEN","Full Fish"],
  [147,"BIG SUPPARA","Full Fish"],[148,"EARI SMALL","Full Fish"],[149,"MRIGAL","Full Fish"],
  [150,"KARICHALA","Full Fish"],[151,"POOMEAN SEA PSC","Fish Piece"],
  [152,"NADAN KATTLA","Full Fish"],[153,"AVOLI BLACK BIG","Full Fish"],
  [154,"SHEELAV BIG","Full Fish"],[155,"KUTTAN","Full Fish"],[156,"ROMIYO KILI","Full Fish"],
  [157,"EATTA PSC","Fish Piece"],[158,"SHARK","Full Fish"],[159,"OLA WHITE","Full Fish"],
  [160,"CHEMMEN SMALL","Full Fish"],[161,"OLI NEYMEEN","Full Fish"],
  [162,"CUTLA PCS","Full Fish"],[163,"KADAL KOLAN","Full Fish"],
  [164,"NADAN KALANJI PCS","Fish Piece"],[165,"WHITE KERA","Full Fish"],
  [166,"PUNNARA VATTA","Full Fish"],[167,"PUNNARA VATTA PCS","Fish Piece"],
  [168,"KAROOP","Full Fish"],[169,"SILK BIG","Full Fish"],[170,"PALLIMEEN","Full Fish"],
  [171,"KADAL KALANJI PCS","Fish Piece"],[172,"NADAN CHEMPALLY","Full Fish"],
  [173,"YELLOW EARI PCS","Fish Piece"],[174,"PULLAN","Full Fish"],
  [175,"NEYMEEN MEDIUM","Full Fish"],[176,"NADAN BRAAL","Full Fish"],
  [177,"KANAVA BIG","Full Fish"],[178,"PARINTHADA","Full Fish"],
  [179,"ETTA SMALL","Full Fish"],[180,"PIRANA SMALL","Full Fish"],
  [181,"KAKKA BIG","Full Fish"],[182,"SOOJI KOZHUVA","Full Fish"]
];

const VACANT = ["A","B","C","D","E","F","G","H","I","J"];

let activeFilter = "ALL";
let toastTimer;

const searchEl = document.getElementById('search');
const resultsEl = document.getElementById('results');
const emptyEl = document.getElementById('empty');
const tableWrap = document.getElementById('table-wrap');
const countEl = document.getElementById('result-count');
const toast = document.getElementById('toast');

// Build vacant grid
const vg = document.getElementById('vacant-grid');
VACANT.forEach(code => {
  const div = document.createElement('div');
  div.className = 'vacant-item';
  div.innerHTML = `<span class="vacant-code">${code}</span><span class="vacant-label">vacant</span>`;
  vg.appendChild(div);
});

function catClass(cat) {
  if (cat === 'Fish Piece') return 'piece';
  if (cat === 'Fish Head') return 'head';
  return '';
}

function highlight(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
}

function render() {
  const q = searchEl.value.trim();
  const matches = FISH.filter(([code, name, cat]) => {
    const matchSearch = !q ||
      name.toLowerCase().includes(q.toLowerCase()) ||
      String(code) === q;
    const matchFilter = activeFilter === 'ALL' || cat === activeFilter;
    return matchSearch && matchFilter;
  });

  resultsEl.innerHTML = '';
  const showing = document.querySelector('#result-count span');
  showing.textContent = matches.length;

  if (matches.length === 0) {
    emptyEl.style.display = 'block';
    tableWrap.style.display = 'none';
    return;
  }
  emptyEl.style.display = 'none';
  tableWrap.style.display = 'block';

  matches.forEach(([code, name, cat]) => {
    const row = document.createElement('div');
    row.className = 'result-row';
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-label', `Code ${code}: ${name}. Press to copy.`);
    row.innerHTML = `
      <div><span class="code-badge">${code}</span></div>
      <div class="fish-name">${highlight(name, q)}</div>
      <div class="cat-tag ${catClass(cat)}">${cat}</div>
    `;
    row.addEventListener('click', () => copyCode(code, name));
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') copyCode(code, name); });
    resultsEl.appendChild(row);
  });
}

function copyCode(code, name) {
  const text = String(code);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text)
      .then(() => showToast(`✓  Code ${code} — ${name}`))
      .catch(() => showToast(`Code: ${code} — ${name}`));
  } else {
    showToast(`Code: ${code} — ${name}`);
  }
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

// Filters
document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    activeFilter = pill.dataset.cat;
    render();
  });
});

searchEl.addEventListener('input', render);

render();
</script>
</body>
</html>
